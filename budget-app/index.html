    ? `<button class="navbtn" data-action="go" data-page="${n[0]}">${IC[n[2]]}<span>${n[1]}</span></button>`
    : `<button class="tab" data-action="go" data-page="${n[0]}">${IC[n[2]]}<span>${n[1]}</span></button>`).join('');
  root.innerHTML = (desk
    ? `<div class="bar"><i></i><i></i><i></i><span class="url">payday-budget.app</span></div>
       <div class="shell"><aside class="side"><a class="logo" href="#overview" aria-label="Home"><svg viewBox="0 0 118 24" width="98" height="20" fill="currentColor" aria-hidden="true"><path d="M.197 20V5.594h7.68599c.812 0 1.547.189 2.20501.567.672.378 1.204.889 1.596 1.533.392.644.588 1.372.588 2.184v.462c0 .812-.203 1.561-.609 2.247-.392.686-.924 1.239-1.596 1.659-.65801.42-1.39301.63-2.20501.63h-3.255V20h-4.41Zm4.40999-8.337h1.932c.266 0 .49-.056.672-.168.182-.112.322-.273.42-.483.112-.21.168-.462.168-.756 0-.35-.105-.665-.315-.945-.196-.28-.511-.42-.945-.42h-1.932v2.772ZM25.1351 20.21c-.644 0-1.183-.084-1.617-.252-.434-.182-.77-.469-1.008-.861-.224-.392-.336-.924-.336-1.596 0-.21-.014-.462-.042-.756-.028-.294-.105-.574-.231-.84-.112-.28-.294-.511-.546-.693-.252-.196-.602-.294-1.05-.294h-1.218V20h-4.305V5.594h8.064c.686 0 1.33.14 1.932.42.616.266 1.113.665 1.491 1.197.392.518.588 1.169.588 1.953 0 .658-.119 1.253-.357 1.785-.238.518-.553.959-.945 1.323-.392.35-.819.616-1.281.798v.105c.406.126.756.301 1.05.525.294.224.532.49.714.798.182.294.315.602.399.924.098.322.147.637.147.945 0 .21.007.455.021.735.014.266.049.525.105.777.07.252.175.476.315.672.154.196.364.329.63.399v.861c-.378.154-.791.259-1.239.315-.448.056-.875.084-1.281.084Zm-6.048-8.505h2.142c.21 0 .399-.063.567-.189.182-.14.322-.322.42-.546.098-.224.147-.483.147-.777 0-.448-.105-.777-.315-.987-.21-.21-.462-.315-.756-.315h-2.205v2.814ZM30.1466 20V5.594h10.815l-.42 3.36h-6.069v2.1h5.838v3.213h-5.838v2.373h6.069l.42 3.36h-10.815Zm49.4156 0V5.594h4.431v10.878h5.25l.42 3.528h-10.101Zm12.4729 0V5.594h4.431v10.878h5.2499l.42 3.528H92.0351Zm18.2269.21c-.868 0-1.687-.161-2.457-.483-.756-.336-1.421-.791-1.995-1.365-.574-.574-1.029-1.239-1.365-1.995-.322-.77-.483-1.589-.483-2.457v-2.184c0-.868.161-1.68.483-2.436.336-.77.791-1.442 1.365-2.016.574-.574 1.239-1.022 1.995-1.344.77-.336 1.589-.504 2.457-.504h1.176c.868 0 1.68.168 2.436.504.77.322 1.442.77 2.016 1.344.574.574 1.022 1.246 1.344 2.016.336.756.504 1.568.504 2.436v2.184c0 .868-.168 1.687-.504 2.457-.322.756-.77 1.421-1.344 1.995-.574.574-1.246 1.029-2.016 1.365-.756.322-1.568.483-2.436.483h-1.176Zm.588-3.276c.322 0 .609-.056.861-.168.266-.112.497-.259.693-.441.196-.196.343-.42.441-.672.112-.252.168-.525.168-.819v-4.032c0-.294-.056-.567-.168-.819-.098-.252-.245-.476-.441-.672-.196-.196-.427-.343-.693-.441-.252-.112-.539-.168-.861-.168-.308 0-.595.056-.861.168-.266.112-.497.266-.693.462-.196.182-.35.399-.462.651-.098.252-.147.525-.147.819v4.032c0 .294.049.567.147.819.112.252.266.476.462.672.196.196.427.35.693.462.266.098.553.147.861.147Zm-35.5684 3.9939c.8304 1.6696-.8304 3.9653-2.9065 2.7131 0 0-7.889-5.2175-13.702-7.5132l-3.5293 6.6784c-.2076.6261-1.6609 1.6696-2.9065.8348-9.7575-5.6349-7.8891-16.69612 4.3597-12.9395l4.9826-9.60028c1.038-1.66962 3.1141-1.25221 3.7369 0l9.9651 19.82668Zm-20.553-6.2611c-7.8891-2.2957-3.7369 3.1306-2.0761 4.1741l2.0761-4.1741Zm13.4944 1.461-4.9826-9.39163-2.6989 5.63493c1.8685.6261 6.0206 2.9219 7.6815 3.7567Z"/></svg></a>${navHTML}<div class="sidesec"><span>Months</span><button class="iconbtn sm" data-action="newMonth" aria-label="Start a new month">${IC.plus}</button></div><div class="months" data-r="months"></div><div class="sidefoot"><button class="who" data-action="go" data-page="goals" aria-label="Signed in as ${esc(S.profile.name)}. Open settings."><span class="avatar">${esc((S.profile.name || "?")[0].toUpperCase())}</span><span class="whoname">${esc(S.profile.name)}</span>${IC.goals}</button></div></aside>
       <div class="main"><header class="topbar" data-r="top"></header><main class="screen" data-r="screen"></main></div></div>`
    : `<main class="screen" data-r="screen"></main><nav class="tabbar" aria-label="Main">${navHTML}</nav>`)
    + `<div class="backdrop" data-action="closeSheet"></div>
       <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" data-r="sheetIn"></div></div>
       <div class="tgl" data-r="toast" role="status"></div>`;

  /* ---------- header pieces ---------- */
  function monthSwitch(){
    const keys = sortedKeys(), i = keys.indexOf(S.current);
    return `<div class="month">
      <button class="iconbtn" data-action="monthPrev" aria-label="Previous month" ${i <= 0 ? 'disabled' : ''}>${IC.left}</button>
      <h1><button class="mt" data-action="monthPicker" aria-label="Choose month and year, now ${monthName(S.current)} ${monthYear(S.current)}">${monthName(S.current)}<span class="yr">${monthYear(S.current)}</span></button></h1>
      <button class="iconbtn" data-action="monthNext" aria-label="Next month" ${i >= keys.length - 1 ? 'disabled' : ''}>${IC.right}</button></div>`;
  }
  function startBtn(){
    const nm = monthName(shiftKey(latestKey(), 1));
    return `<button class="pill-btn ${desk ? '' : 'icon-only'}" data-action="newMonth" aria-label="Start ${nm}" title="Start ${nm}">${IC.plus}${desk ? `<span>Start ${nm}</span>` : ''}</button>`;
  }
  const mobHead = () => `<div class="top">${monthSwitch()}${startBtn()}</div>`;

  const G = () => goalsOf(M());
  /* ---------- derived ---------- */
  function stats(){
    const m = M(), c = calc(m);
    const missing = m.items.filter(i => i.amount == null);
    const payable = m.items.filter(i => +i.amount > 0);
    const paidItems = payable.filter(i => i.paid);
    const paid = paidItems.length;
    const paidKr = r2(paidItems.reduce((a, i) => a + (+i.amount || 0), 0));
    const dueKr = r2(payable.reduce((a, i) => a + (+i.amount || 0), 0));
    return {m, c, missing, payable, paid, paidKr, dueKr};
  }
  const W = w => `style="width:${ui.anim ? 0 : w}%" data-w="${w}"`;
  const W2 = W;

  /* ---------- overview ---------- */
  function shortStatus(b, c){
    if (b === 'savings' && savingsSkipped(M().items)) return {cls:'go', txt:'skipped this month'};
    const diff = r2(c.t[b] - c.goalAmt(b));
    if (BUCKETS[b].kind === 'ceiling'){
      if (diff <= 0) return {cls:'ok', txt:diff === 0 ? 'on target' : krw(-diff) + ' under'};
      return {cls:'warn', txt:krw(diff) + ' over'};
    }
    if (diff >= 0) return {cls:'ok', txt:'goal met'};
    return {cls:'go', txt:krw(-diff) + ' to go'};
  }
  /* ================= OVERVIEW ================= */
  const BK = [['needs','Needs'],['wants','Wants'],['savings','Savings']];
  const EMPTY = {needs:'No needs yet. Rent, food and bills go here.', wants:'No wants yet. The fun money goes here.', savings:'No savings yet. Even 0 is a decision.'};
  const LOCK = '<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="10.5" rx="2.5" fill="currentColor"/></svg>';
  const dayLabel = d => { const [y, mo] = S.current.split('-').map(Number); return new Date(y, mo - 1, d).toLocaleDateString('en-GB', {weekday:'short', day:'numeric'}); };
  const savedSoFar = () => {
    const ks = sortedKeys();
    return {n:ks.length, total:r2(ks.reduce((a, k) => a + calc(S.months[k]).t.savings, 0))};
  };
  const weeksLeft = () => Math.max(1, Math.ceil(daysLeft(S.current) / 7));

  /* ---- region B: hero ---- */
  function regionHero(st){
    const c = st.c, dl = daysLeft(S.current), neg = c.free < 0;
    const exact = dayOfCycle(S.current) <= 2 || st.missing.length > 0;
    const band = v => krw(Math.round(v / 100) * 100);  /* softened to the nearest hundred from day 3, see FAQ */
    return `<section class="card r-hero">
      <div class="eyebrow">LEFT TO SPEND${dl > 0 ? ' · ' + dl + ' DAYS LEFT' : ''}</div>
      <div class="hero-n ${neg ? 'neg' : ''}">${neg || exact ? krw(c.free) : band(c.free)}</div>
      <div class="hero-wk">${krw(c.free / weeksLeft())} <span>a week for the next ${weeksLeft()} weeks</span></div>
      ${neg ? `<div class="status warn">Your plan needs more than your salary.</div>` : ''}
      <button class="hero-src" data-action="editIncome">From <b>${krw(c.inc)}</b> salary, <b>${krw(c.reserved)}</b> is reserved<span>Change</span></button>
      <button class="btn-primary" data-action="go" data-page="plan">${st.missing.length ? 'Finish plan · ' + st.missing.length + (st.missing.length === 1 ? ' amount' : ' amounts') + ' missing' : 'Open plan'}</button>
    </section>`;
  }

  /* ---- activity rings ----
     savings ring FILLS toward its goal and closes at 100% (goal-gradient, Kivetz 2006).
     needs and wants rings DRAIN: full at payday, shrinking as you plan, so the ring shows room left,
     not spending progress (spent-framing invites spending the slack: Huang & Liang 2018, Yin & Sharif 2023).
     past the ceiling the ring is empty and a darker lap shows the overshoot. */
  function ringsSVG(c, g, size = 240){
    const CX = size / 2, SW = size * 0.085, GAP = size * 0.02;
    const radii = {needs: CX - SW / 2 - 2, wants: CX - SW * 1.5 - GAP - 2, savings: CX - SW * 2.5 - GAP * 2 - 2};
    let out = '';
    ['needs','wants','savings'].forEach(k => {
      const R = radii[k], Cc = 2 * Math.PI * R, used = g[k] > 0 ? c.pct(k) / g[k] : 0;
      const fill = k === 'savings' ? Math.min(1, used) : Math.max(0, 1 - used);
      const lap = k === 'savings' ? 0 : Math.max(0, Math.min(1, used - 1));
      const main = fill * Cc, lapLen = lap * Cc;
      const skipped = k === 'savings' && savingsSkipped(M().items);
      out += `<circle class="ring-trk ${k}" cx="${CX}" cy="${CX}" r="${R}" fill="none" stroke-width="${SW}"/>`;
      if (!skipped && main > 0.5) out += `<circle class="s-${k}" cx="${CX}" cy="${CX}" r="${R}" fill="none" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${ui.anim ? 0 : main} ${Cc}" data-dash="${main} ${Cc}"/>`;
      if (lapLen > 0.5) out += `<circle class="s-lap ${k}" cx="${CX}" cy="${CX}" r="${R}" fill="none" stroke-width="${SW}" stroke-linecap="round" stroke-dasharray="${ui.anim ? 0 : lapLen} ${Cc}" data-dash="${lapLen} ${Cc}"/>`;
    });
    const hit = ['needs','wants','savings'].filter(k => ['closed','room','limit'].includes(ringState(k, c, g))).length;
    return `<svg viewBox="0 0 ${size} ${size}" class="rings" role="img" aria-label="${hit} of 3 on target. Needs ${Math.round(c.pct('needs'))} of ${g.needs} percent, wants ${Math.round(c.pct('wants'))} of ${g.wants}, savings ${Math.round(c.pct('savings'))} of ${g.savings}.">${out}</svg>`;
  }
  /* savings: open | closed | skipped.  ceilings: room | near (80 to 100% used) | limit | over */
  function ringState(k, c, g){
    const used = g[k] > 0 ? c.pct(k) / g[k] : 0;
    if (k === 'savings'){ if (savingsSkipped(M().items)) return 'skipped'; return used >= 0.995 ? 'closed' : 'open'; }
    if (used > 1.005) return 'over';
    if (used >= 0.995) return 'limit';
    return used >= 0.8 ? 'near' : 'room';
  }
  const onTarget = (k, c, g) => ['closed','room','near','limit'].includes(ringState(k, c, g));
  /* small-area rule (Koo & Fishbach 2012): show whichever is smaller, done or remaining */
  function ringDetail(k, c, g){
    const st = ringState(k, c, g), diff = r2(c.t[k] - c.goalAmt(k)), used = g[k] > 0 ? c.pct(k) / g[k] : 0;
    if (k === 'savings') return st === 'closed' ? 'closed' : st === 'skipped' ? 'skipped this month' : used < 0.5 ? krw(c.t[k]) + ' saved' : krw(-diff) + ' to go';
    if (st === 'over') return krw(diff) + ' over';
    if (st === 'limit') return 'at the limit';
    return krw(-diff) + ' room';
  }

  /* ---- region D: your 50 / 30 / 20 ---- */
  function regionSplit(c){
    const g = G();
    const top = Math.max(60, Math.ceil(Math.max(c.pct('needs'), c.pct('wants'), c.pct('savings'), g.needs, g.wants, g.savings) / 10) * 10);
    const rows = ['needs','wants','savings'].map(k => {
      const st = shortStatus(k, c), pct = c.pct(k), fill = Math.min(100, pct / top * 100), gpos = Math.min(100, g[k] / top * 100);
      return `<button class="goal" data-action="goBucket" data-b="${k}" aria-label="${BUCKETS[k].label}, ${w0(c.t[k])} ${CUR()}, ${Math.round(pct)} percent of salary against a goal of ${g[k]} percent, ${st.txt}. Open list.">
        <span class="g-top"><i class="dot ${k}"></i>${BUCKETS[k].label}<em>${Math.round(pct)}<i>/${g[k]}%</i></em><b>${w0(c.t[k])}</b></span>
        <span class="g-meter"><i class="${k}-fill" ${W2(fill)}></i><em style="left:${gpos}%"></em></span>
      </button>`;
    }).join('');
    const sf = savedSoFar();
    return `<section class="card r-split">
      <div class="eyebrow">YOUR GOALS</div>
      <div class="ringwrap">${ringsSVG(c, g, 160)}
        <div class="rmid"><b>${['needs','wants','savings'].filter(k => onTarget(k, c, g)).length}<i>/3</i></b><small>on target</small></div></div>
      <div class="goals">${rows}</div>
      <div class="sofar"><b>${krw(sf.total)}</b><span>kept, not spent, across ${sf.n} ${sf.n === 1 ? 'month' : 'months'}</span></div>
    </section>`;
  }

  /* ---- region E: by category (all derived) ---- */
  function regionCats(c){
    const mx = Math.max(1, ...c.cats.map(x => x.total));
    const rows = c.cats.map(x => {
      const seg = (v, k) => v > 0 ? `<i class="${k}-fill" style="width:${v / x.total * 100}%"></i>` : '';
      return `<div class="cat">
        <div class="cat-h"><span>${x.name}</span><b>${w0(x.total)}</b><em>${Math.round(x.total / (c.inc || 1) * 100)}%</em></div>
        <div class="cat-bar" style="width:${Math.max(4, x.total / mx * 100)}%">${seg(x.by.needs,'needs')}${seg(x.by.wants,'wants')}${seg(x.by.savings,'savings')}</div>
      </div>`;
    }).join('');
    return `<section class="card r-cat">
      <div class="eyebrow">BY CATEGORY</div>
      <p class="micro" style="margin:2px 0 12px">Every item has one category. Bar colour shows which bucket it sits in.</p>
      <div class="cats">${rows || '<div class="empty">Bars appear as you add amounts.</div>'}</div>
    </section>`;
  }

  /* ---- region F: scheduled payments ---- */
  function regionCommitted(st){
    const m = st.m, today = Math.max(1, dayOfCycle(S.current));
    const dated = m.items.filter(i => +i.amount > 0 && i.due).sort((a, b) => a.due - b.due);
    const undated = m.items.filter(i => +i.amount > 0 && !i.due);
    const pending = r2(dated.filter(i => !i.paid).reduce((a, i) => a + (+i.amount || 0), 0));
    const paidKr = r2(dated.filter(i => i.paid).reduce((a, i) => a + (+i.amount || 0), 0));
    const shown = dated.slice(0, 6);
    let out = '', marked = false;
    shown.forEach(i => {
      if (!marked && i.due > today){ out += `<div class="pnow"><span>today</span></div>`; marked = true; }
      const cls = i.paid ? 'done' : i.due < today ? 'past' : i.due === today ? 'now' : '';
      out += `<button class="pay ${cls}" data-action="editItem" data-id="${i.id}" aria-label="${esc(i.name)}, ${w0(i.amount)} ${CUR()}, ${dayLabel(i.due)}${i.paid ? ', paid' : i.due < today ? ', date has passed' : ''}. Edit.">
        <span class="pdot" aria-hidden="true"></span>
        <span class="pdate">${dayLabel(i.due)}</span>
        <span class="pname">${i.locked ? LOCK : ''}${esc(i.name)}${i.origin ? `<small>${esc(i.origin)}</small>` : ''}</span>
        <b>${w0(i.amount)}</b></button>`;
    });
    if (!marked) out += `<div class="pnow end"><span>today</span></div>`;
    return `<section class="card r-com">
      <div class="eyebrow">COMING UP</div>
      <div class="pend"><b>${krw(pending)}</b><span>still to leave your account</span></div>
      <div class="plist">${out || '<div class="empty">Give an item a payment date and it shows here.</div>'}</div>
      ${dated.length > shown.length ? `<button class="morelink" data-action="go" data-page="plan">All ${dated.length} in Plan</button>` : ''}
    </section>`;
  }

  /* ================= DESKTOP OVERVIEW (two columns) ================= */
  /* rolling digits for the two hero numbers: each digit is a 0-9 strip that slides to its value */
  function rollHTML(key, str){
    const prev = ui.roll[key]; ui.roll[key] = str;
    const pd = prev == null ? '' : prev.replace(/\D/g, ''), nd = (str.match(/\d/g) || []).length;
    let di = 0;
    return `<span class="roll" data-roll="${key}" role="text" aria-label="${esc(str)}"><span aria-hidden="true" class="roll-in">` + [...str].map(ch => {
      if (!/\d/.test(ch)) return `<span class="rs">${ch === ' ' || ch === '\u00a0' ? '&nbsp;' : ch}</span>`;
      const idx = di++, pi = idx - (nd - pd.length);
      const start = (prev == null || ui.anim) ? 0 : (pi >= 0 && pi < pd.length ? +pd[pi] : +ch);  /* ui.anim: the rings redraw from zero, so the numbers roll from zero with them */
      return `<span class="rd"><i style="transform:translateY(${-start}em)" data-to="${ch}" data-i="${idx}">${'0123456789'.split('').map(d => `<span>${d}</span>`).join('')}</i></span>`;
    }).join('') + `</span></span>`;
  }
  function rollPlay(){
    requestAnimationFrame(() => requestAnimationFrame(() => qa('.roll .rd i').forEach(i => {
      i.style.transitionDelay = (+i.dataset.i * 28) + 'ms';
      i.style.transform = `translateY(${-i.dataset.to}em)`;
    })));
  }
  function deskHero(st){
    const c = st.c, dl = daysLeft(S.current), neg = c.free < 0, wk = ui.heroMode === 'week';
    const past = S.current < nowKey(), future = S.current > nowKey();
    const n = past ? Math.max(1, Math.round(daysInMonth(S.current) / 7)) : weeksLeft();  /* closed month: per week across the whole month */
    const exact = past || future || dayOfCycle(S.current) <= 2 || st.missing.length > 0;
    const band = v => krw(Math.round(v / 100) * 100);  /* softened to the nearest hundred from day 3, see FAQ */
    const val = wk ? krw(c.free / n) : (neg || exact ? krw(c.free) : band(c.free));
    const eyebrow = past ? 'Left over' : 'Left to spend';
    const sub = past ? (wk ? `a week, ${monthName(S.current)} had ${n} weeks` : `${monthName(S.current)} is closed`)
      : future ? `for ${monthName(S.current)}, not started yet`
      : wk ? `a week, for the next ${n} ${n === 1 ? 'week' : 'weeks'}` : `for the next ${dl} ${dl === 1 ? 'day' : 'days'}`;
    const miss = st.missing.length;
    return `<section class="card dh">
      <div class="hd center">
        <div class="eyebrow">${eyebrow}</div>
        <div class="dh-n ${neg ? 'neg' : ''}">${rollHTML('free', val)}</div>
        <div class="sub">${neg ? 'Your plan needs more than your salary' : sub}</div>
      </div>
      ${`<div class="seg dh-seg" role="tablist" aria-label="Show amount per">
        <button role="tab" class="${wk ? '' : 'on'}" data-action="heroMode" data-m="month" aria-selected="${!wk}">Month</button>
        <button role="tab" class="${wk ? 'on' : ''}" data-action="heroMode" data-m="week" aria-selected="${wk}">Week</button>
      </div>`}
      <div class="dh-foot">
        <button class="stat" data-action="editIncome" aria-label="Salary ${w0(c.inc)} ${CUR()}. Change."><span class="eyebrow">Salary</span><b>${krw(c.inc)}</b></button>
        <div class="stat"><span class="eyebrow">Reserved</span><b>${krw(c.reserved)}</b></div>
        ${miss
          ? `<button class="stat attn" data-action="go" data-page="plan" aria-label="${miss} ${miss === 1 ? 'amount' : 'amounts'} to fill in. Open plan."><span class="eyebrow">To fill in</span><b>${miss} ${miss === 1 ? 'amount' : 'amounts'}</b></button>`
          : `<button class="stat ${st.paid === st.payable.length && st.payable.length ? 'done' : ''}" data-action="go" data-page="plan" aria-label="${st.paid} of ${st.payable.length} paid. Open plan."><span class="eyebrow">Paid</span><b>${st.paid} of ${st.payable.length}</b></button>`}
      </div>
    </section>`;
  }

  function deskRing(c){
    const g = G(), sf = savedSoFar();
    const hit = ['needs','wants','savings'].filter(k => onTarget(k, c, g)).length;
    const rows = ['needs','wants','savings'].map(k => {
      const st = ringState(k, c, g), pct = Math.round(c.pct(k));
      return `<button class="rg-row" data-action="goBucket" data-b="${k}" aria-label="${BUCKETS[k].label}, ${pct} of ${g[k]} percent, ${ringDetail(k, c, g)}. Open list.">
        <i class="dot ${k}"></i>
        <span class="rg-name">${BUCKETS[k].label}<small class="${st}">${ringDetail(k, c, g)}</small></span>
        <b class="${st}">${pct}<i>/${g[k]}%</i></b>
      </button>`;
    }).join('');
    const sv = ringState('savings', c, g);
    const sub = hit === 3 ? 'All three on target. Rings reset on payday.'
      : sv !== 'closed' && sv !== 'skipped' ? 'Close the savings ring. The other two show room left.'
      : 'Savings closed. Bring needs and wants back inside their rings.';
    return `<section class="card dr">
      <div class="hd"><div class="eyebrow">Your goals</div><div class="val">${hit} of 3 on target</div><div class="sub">${sub}</div></div>
      <div class="rg"><div class="rg-rings">${ringsSVG(c, g, 240)}</div><div class="rg-rows">${rows}</div></div>
      <div class="dh-foot one"><div class="stat"><span class="eyebrow">Kept, not spent</span><b>${krw(sf.total)}</b><small>across ${sf.n} ${sf.n === 1 ? 'month' : 'months'}. Wealth is the money you did not see.</small></div></div>
    </section>`;
  }

  function deskComing(st){
    const m = st.m, today = Math.max(1, dayOfCycle(S.current));
    const dated = m.items.filter(i => +i.amount > 0 && i.due).sort((a, b) => a.due - b.due);
    const pending = r2(dated.filter(i => !i.paid).reduce((a, i) => a + (+i.amount || 0), 0));
    const shown = dated.slice(0, 7);
    const nextId = (dated.find(i => !i.paid && i.due >= today) || {}).id;
    const out = shown.map(i => {
      const cls = i.paid ? 'done' : i.id === nextId ? 'now' : i.due < today ? 'past' : '';
      return `<button class="pay ${cls}" data-action="editItem" data-id="${i.id}" aria-label="${esc(i.name)}, ${w0(i.amount)} ${CUR()}, ${dayLabel(i.due)}${i.paid ? ', paid' : i.id === nextId ? ', next' : i.due < today ? ', date has passed' : ''}. Edit.">
        <span class="pdot" aria-hidden="true"></span>
        <span class="pdate">${dayLabel(i.due)}</span>
        <span class="pname">${i.locked ? LOCK : ''}${esc(i.name)}${i.origin ? `<small>${esc(i.origin)}</small>` : ''}</span>
        <b>${w0(i.amount)}</b></button>`;
    }).join('');
    return `<section class="card r-com">
      <div class="hd"><div class="eyebrow">Coming up</div><div class="val">${rollHTML('coming', krw(pending))}</div><div class="sub">still to leave your account</div></div>
      <div class="plist">${out || '<div class="empty">Give an item a payment date and it shows here.</div>'}</div>
      ${dated.length > shown.length ? `<button class="morelink" data-action="go" data-page="plan">All ${dated.length} in Plan</button>` : ''}
    </section>`;
  }

  /* ---- month by month: one bar per month on a 0 to 100% of salary scale, goal marks per month,
          savings rate at the right because the rate is the lever (Housel). No streak, just history. ---- */
  function deskMonths(){
    const keys = sortedKeys().slice(-6).reverse();
    const mon = k => new Date(+k.split('-')[0], +k.split('-')[1] - 1, 1).toLocaleString('en-GB', {month:'short'});
    const data = keys.map(k => {
      const m = S.months[k], c = calc(m), g = goalsOf(m);
      const miss = ['needs','wants','savings'].filter(b => b === 'savings' ? (c.pct(b) < g[b] - 0.5 && !savingsSkipped(m.items)) : c.pct(b) > g[b] + 0.5);
      return {k, c, g, miss, on: miss.length === 0};
    });
    const hit = data.filter(d => d.on).length, cur = data[0], prev = data[1];
    const curG = cur ? cur.g : G();
    // headline: the savings rate and where it is heading
    let val = '', sub = '';
    if (!cur) { val = 'No months yet'; }
    else if (!prev) { val = Math.round(cur.c.pct('savings')) + '% saved'; sub = 'History builds as you add months.'; }
    else {
      const a = Math.round(cur.c.pct('savings')), b = Math.round(prev.c.pct('savings'));
      val = a > b ? `${a}% saved, up from ${b}%` : a < b ? `${a}% saved, down from ${b}%` : `${a}% saved, same as ${mon(prev.k)}`;
      const counts = {};
      data.forEach(d => d.miss.forEach(m => { counts[m] = (counts[m] || 0) + 1; }));
      const worst = Object.entries(counts).sort((x, y) => y[1] - x[1])[0];
      sub = hit === data.length ? `All ${data.length} months on target.` : `${hit} of ${data.length} months on target.` + (worst ? ` ${BUCKETS[worst[0]].label} is the one that keeps missing.` : '');
    }
    const rows = data.map(d => {
      const pct = b => Math.min(100, Math.max(0, d.c.pct(b)));
      const used = d.c.pct('needs') + d.c.pct('wants') + d.c.pct('savings'), over = used > 100.5;
      const seg = b => `<i class="${b}-fill" ${W2(pct(b))}></i>`;
      const sOk = !d.miss.includes('savings');
      return `<button class="mm-row ${d.k === S.current ? 'cur' : ''}" data-action="pickMonth" data-key="${d.k}" aria-label="${monthName(d.k)}: needs ${Math.round(d.c.pct('needs'))}, wants ${Math.round(d.c.pct('wants'))}, savings ${Math.round(d.c.pct('savings'))} percent of salary. ${d.on ? 'On target.' : 'Missed ' + d.miss.join(' and ') + '.'} Open month.">
        <span class="mm-m">${mon(d.k)}</span>
        <span class="mm-wrap"><span class="mm-bar">${seg('needs')}${seg('wants')}${seg('savings')}</span><em style="left:${d.g.needs}%"></em><em style="left:${d.g.needs + d.g.wants}%"></em></span>
        <b class="${over ? 'warn' : sOk ? 'ok' : ''}">${over ? w0(-d.c.left) + ' over' : Math.round(d.c.pct('savings')) + '% saved'}</b>
      </button>`;
    }).join('');
    return `<section class="card mm">
      <div class="hd"><div class="eyebrow">Month by month</div><div class="val">${val}</div><div class="sub">${sub}</div></div>
      <div class="mm-axis" aria-hidden="true"><span></span><span class="mm-scale"><i style="left:0">0</i><i style="left:${curG.needs}%">${curG.needs}</i><i style="left:${curG.needs + curG.wants}%">${curG.needs + curG.wants}</i><i style="left:100%">100%</i></span><span class="mm-axlbl">of salary</span></div>
      <div class="mm-rows">${rows}</div>
      <div class="mm-key"><span><i class="dot needs"></i>Needs</span><span><i class="dot wants"></i>Wants</span><span><i class="dot savings"></i>Savings</span><span class="mm-tick"><i></i>goal lines</span></div>
    </section>`;
  }

  /* ---- overview v3: one card per bucket, big number + one plain line + a small history chart ---- */
  function bucketLine(k, c, g){
    const st = ringState(k, c, g), diff = r2(c.t[k] - c.goalAmt(k));
    if (k === 'savings') return st === 'closed' ? `Goal met, ${g[k]}% of salary` : st === 'skipped' ? `Skipped this month` : `${krw(-diff)} more to reach ${g[k]}%`;
    if (st === 'over') return desk ? `${krw(diff)} over the ${g[k]}% goal` : `${krw(diff)} over goal`;
    if (st === 'limit') return `Right at the ${g[k]}% goal`;
    return desk ? `${krw(-diff)} under the ${g[k]}% goal` : `${krw(-diff)} under goal`;
  }
  function miniChart(k){
    const keys = sortedKeys().slice(-6);
    const pts = keys.map(key => { const m = S.months[key], c = calc(m), g = goalsOf(m); return {key, p: c.pct(k), g: g[k]}; });
    const gNow = pts[pts.length - 1].g;
    const top = Math.max(gNow, ...pts.map(p => p.p)) * 1.25 || 100;
    const W = desk ? 320 : 220, H = 96, padB = 18, padT = 14, ih = H - padB - padT, bw = desk ? 26 : 22, step = W / Math.max(pts.length, 3);
    const y = v => padT + ih - (ih * Math.min(v, top) / top);
    const bars = pts.map((p, i) => {
      const x = 30 + ((W - 30) / Math.max(pts.length, 3)) * (i + 0.5) - bw / 2, cur = p.key === S.current, h = Math.max(2, ih - (y(p.p) - padT));
      const lbl = new Date(+p.key.split('-')[0], +p.key.split('-')[1] - 1, 1).toLocaleString('en-GB', {month:'short'});
      return `<rect x="${x}" y="${y(p.p)}" width="${bw}" height="${h}" rx="4" class="mc-bar ${cur ? 'cur' : ''}" style="fill:var(--${k})"></rect>
        ${cur ? `<text x="${x + bw / 2}" y="${y(p.p) - 4}" class="mc-val">${Math.round(p.p)}%</text>` : ''}
        <text x="${x + bw / 2}" y="${H - 4}" class="mc-x ${cur ? 'cur' : ''}">${lbl}</text>`;
    }).join('');
    return `<svg class="mc" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
      <text x="0" y="${y(gNow) + 4}" class="mc-g">${gNow}%</text>
      <line x1="30" x2="${W}" y1="${y(gNow)}" y2="${y(gNow)}" class="mc-goal"></line>${bars}</svg>`;
  }
  function bucketCard(k, c){
    const g = G(), st = ringState(k, c, g);
    const tone = k === 'savings' ? (st === 'closed' ? 'ok' : st === 'open' ? '' : 'mut') : (st === 'over' ? 'bad' : st === 'near' || st === 'limit' ? 'warn' : '');
    return `<button class="card bc" data-action="goBucket" data-b="${k}" aria-label="${BUCKETS[k].label}, ${w0(c.t[k])} ${CUR()}. ${bucketLine(k, c, g)}. Open list.">
      <div class="bc-l">
        <div class="bc-lbl" style="color:var(--${k}-ink)"><i class="dot" style="background:var(--${k})"></i>${BUCKETS[k].label}</div>
        <div class="bc-n">${rollHTML('b-' + k, w0(c.t[k]))}<small>${curSym()}</small></div>
        <div class="bc-sub ${tone}">${bucketLine(k, c, g)}</div>
      </div>
      <div class="bc-ch">${miniChart(k)}</div>
    </button>`;
  }
  function deskSplit(c){
    const g = G(), tot = c.inc || 1;
    const seg = k => Math.max(0, Math.min(100, c.t[k] / tot * 100));
    const left = Math.max(0, 100 - seg('needs') - seg('wants') - seg('savings'));
    return `<section class="card sp">
      <div class="hd"><div class="eyebrow">Where ${monthName(S.current)} goes</div></div>
      <div class="sp-bar" aria-hidden="true">${['needs','wants','savings'].map(k => `<i style="width:${seg(k)}%;background:var(--${k})"></i>`).join('')}<i style="width:${left}%;background:var(--p-10)"></i></div>
      <div class="sp-leg">${['needs','wants','savings'].map(k => `<span><i style="background:var(--${k})"></i>${BUCKETS[k].label} <b>${w0(c.t[k])}</b></span>`).join('')}<span><i style="background:var(--p-16)"></i>Left <b>${w0(Math.max(0, c.free))}</b></span></div>
    </section>`;
  }
  function ringCard(c){
    const g = G(), hit = ['needs','wants','savings'].filter(k => onTarget(k, c, g)).length, sv = ringState('savings', c, g);
    const sub = hit === 3 ? 'All three on target. Rings reset on payday.'
      : sv !== 'closed' && sv !== 'skipped' ? 'Close the savings ring. The other two show room left.'
      : 'Savings closed. Bring needs and wants back inside their rings.';
    return `<section class="card rc">
      <div class="rc-rings">${ringsSVG(c, g, 150)}</div>
      <div class="rc-t"><div class="eyebrow">Your goals</div><div class="val">${hit} of 3 on target</div><div class="sub">${sub}</div></div>
    </section>`;
  }
  function viewOverview(){
    const st = stats(), c = st.c;
    if (desk) return `<div class="ov ov2">
      <div class="ov-l">${deskHero(st)}${bucketCard('needs', c)}${bucketCard('wants', c)}${bucketCard('savings', c)}</div>
      <div class="ov-r">${ringCard(c)}${deskComing(st)}</div></div>`;
    return mobHead() + deskHero(st) + ringCard(c) + bucketCard('needs', c) + bucketCard('wants', c) + bucketCard('savings', c) + deskComing(st);
  }



  /* ---------- plan ---------- */
  function rowHTML(i){
    return `<div class="row ${i.id === ui.flash ? 'flash' : ''}">
      <button class="chk ${i.paid ? 'on' : ''}" data-action="togglePaid" data-id="${i.id}" aria-pressed="${i.paid}" aria-label="${i.paid ? 'Mark ' + esc(i.name) + ' as not paid' : 'Mark ' + esc(i.name) + ' as paid'}">${IC.check}</button>
      <button class="rname ${i.paid ? 'done' : ''}" data-action="editItem" data-id="${i.id}" aria-label="${esc(i.name)}${i.due ? ', ' + dayLabel(i.due) : ''}, ${esc(i.cat || 'Other')}. Edit.">${esc(i.name)}</button>
      <label class="ramt ${curPrefix() ? 'pre' : ''}">${curPrefix() ? `<span>${curSym()}</span>` : ''}<input inputmode="decimal" autocomplete="off" data-input="amount" data-id="${i.id}" aria-label="Amount for ${esc(i.name)}" placeholder="Add" value="${i.amount == null ? '' : fmtN(i.amount)}">${curPrefix() ? '' : `<span>${curSym()}</span>`}</label>
    </div>`;
  }
  function bucketHeader(b, c){
    const s = statusOf(b, c);
    return `<div class="ph-top"><div><div class="eyebrow ink">${BUCKETS[b].label.toUpperCase()}</div><div class="ph-total">${kr(c.t[b])}</div></div>
      ${desk ? `<div class="ph-r"><div>${pctTxt(c.pct(b))}</div><div>${G()[b] ? 'Goal ' + G()[b] + '%' : 'No goal'}</div></div>` : `<div class="ph-pct"><b class="${s.cls}">${Math.round(c.pct(b))}<i>/${G()[b] || 0}%</i></b><small>of salary</small></div>`}</div>
      <div class="meter"><i class="${b}-fill" ${W(Math.min(100, c.pct(b)))}></i>${G()[b] ? `<b style="left:${G()[b]}%"></b>` : ``}</div>
      <div class="status ${s.cls}">${s.txt}</div>`;
  }
  function blockHTML(b, c){
    const m = M(), items = m.items.filter(i => i.bucket === b);
    let rows = '', prev = '';
    items.forEach(i => {
      const g = i.group || '';
      if (g !== prev) { if (g) rows += `<div class="grp">${esc(g)}</div>`; prev = g; }
      rows += rowHTML(i);
    });
    if (!items.length) rows = `<div class="empty">${EMPTY[b]}</div>`;
    let chips = '';
    const pk = shiftKey(S.current, -1);
    if (S.months[pk]){
      const have = new Set(m.items.map(i => i.name.toLowerCase()));
      const sug = S.months[pk].items.filter(i => i.bucket === b && !have.has(i.name.toLowerCase()));
      if (sug.length) chips = `<div class="hint-title">From ${monthName(pk)}</div><div class="chips">${sug.map(i => `<button class="chip" data-action="chipAdd" data-src="${pk}" data-id="${i.id}">+ ${esc(i.name)}</button>`).join('')}</div>`;
    }
    const skipBtn = b === 'savings' && !savingsSkipped(m.items) && items.length ? `<div class="chips" style="margin-top:12px"><button class="chip" data-action="skipSavings">Skip savings this month</button></div>` : '';
    return `<div class="blk"><div class="phead ${b}">${bucketHeader(b, c)}</div>
      <div class="list"><button class="add-row top" data-action="addItem" data-b="${b}"><span class="plus">${IC.plus}</span>Add to ${BUCKETS[b].label}</button>${rows}</div>${skipBtn}${chips}</div>`;
  }
  function accordion(c){
    const m = M(), g = G();
    return PB.map(b => {
      const items = m.items.filter(i => i.bucket === b), pay = items.filter(i => +i.amount > 0), paid = pay.filter(i => i.paid).length;
      const open = ui.accOpen === b, st = shortStatus(b, c), pid = 'acc-' + layout + '-' + b;
      let body = '';
      if (open){
        let rows = '', prev = '';
        items.forEach(i => {
          const gr = i.group || '';
          if (gr !== prev) { if (gr) rows += `<div class="grp">${esc(gr)}</div>`; prev = gr; }
          rows += rowHTML(i);
        });
        if (!items.length) rows = `<div class="empty">${EMPTY[b]}</div>`;
        const skipBtn = b === 'savings' && !savingsSkipped(m.items) && items.length ? `<button class="chip" data-action="skipSavings">Skip savings this month</button>` : '';
        let chips = '';
        const pk = shiftKey(S.current, -1);
        if (S.months[pk]){
          const have = new Set(m.items.map(i => i.name.toLowerCase()));
          chips = S.months[pk].items.filter(i => i.bucket === b && !have.has(i.name.toLowerCase())).map(i => `<button class="chip" data-action="chipAdd" data-src="${pk}" data-id="${i.id}">+ ${esc(i.name)} <small style="opacity:.7">from ${monthName(pk)}</small></button>`).join('');
        }
        const side = `<aside class="sbox ${b}" aria-label="${BUCKETS[b].label} details">
          <div class="eyebrow">PAID</div><div class="sb-big">${paid} of ${pay.length}</div>
          <div class="prog"><i ${W(pay.length ? paid / pay.length * 100 : 0)}></i></div>
          <div class="sb-line"><span>Planned</span><b>${kr(c.t[b])}</b></div>
          <div class="sb-line"><span>Goal ${g[b]}%</span><b>${kr(c.goalAmt(b))}</b></div>
          <div class="sb-line"><span>Share of salary</span><b>${pctTxt(c.pct(b))}</b></div>
          <div class="meter"><i class="${b}-fill" ${W(Math.min(100, c.pct(b)))}></i><b style="left:${g[b]}%"></b></div>
          <div class="status ${st.cls}">${st.txt}</div></aside>`;
        body = `<div class="accbody"><div class="accmain"><div class="list"><button class="add-row top" data-action="addItem" data-b="${b}"><span class="plus">${IC.plus}</span>Add to ${BUCKETS[b].label}</button>${rows}</div>
          ${skipBtn || chips ? `<div class="chips" style="margin-top:12px">${skipBtn}${chips}</div>` : ''}</div>${side}</div>`;
      }
      return `<section class="accsec"><button class="acch ${b}" data-action="accToggle" data-b="${b}" aria-expanded="${open}" aria-controls="${pid}">
        <span class="ac-name"><i class="dot ${b}"></i>${BUCKETS[b].label}</span>
        <span></span>
        <b class="ac-tot">${kr(c.t[b])}</b>
        <span class="chev" aria-hidden="true">${IC.right}</span>
      </button><div id="${pid}">${body}</div></section>`;
    }).join('');
  }
  function sideBox(b, c){
    const m = M(), g = G(), st = shortStatus(b, c), pay = m.items.filter(i => i.bucket === b && +i.amount > 0), paid = pay.filter(i => i.paid).length;
    return `<div class="eyebrow">PAID</div><div class="sb-big">${paid} of ${pay.length}</div>
      <div class="prog"><i ${W(pay.length ? paid / pay.length * 100 : 0)}></i></div>
      <div class="sb-line"><span>Planned</span><b>${kr(c.t[b])}</b></div>
      <div class="sb-line"><span>Goal ${g[b]}%</span><b>${kr(c.goalAmt(b))}</b></div>
      <div class="sb-line"><span>Share of salary</span><b>${pctTxt(c.pct(b))}</b></div>
      <div class="meter"><i class="${b}-fill" ${W(Math.min(100, c.pct(b)))}></i><b style="left:${g[b]}%"></b></div>
      <div class="status ${st.cls}">${st.txt}</div>`;
  }
  function planList(b, c){
    const m = M(), items = m.items.filter(i => i.bucket === b);
    let rows = '', prev = '';
    items.forEach(i => { const gr = i.group || ''; if (gr !== prev){ if (gr) rows += `<div class="grp">${esc(gr)}</div>`; prev = gr; } rows += rowHTML(i); });
    return `<div class="list"><button class="add-row top" data-action="addItem" data-b="${b}"><span class="plus">${IC.plus}</span>Add to ${BUCKETS[b].label}</button>${rows || `<div class="empty">${EMPTY[b]}</div>`}</div>`;
  }
  function viewPlan(){
    const st = stats(), c = st.c, b = ui.bucket;
    const chips = `<div class="chips2" role="tablist">${PB.map(k => `<button class="chip2 ${k === b ? 'on' : ''}" data-action="setBucket" data-b="${k}" role="tab" aria-selected="${k === b}"><i class="dot ${k}"></i>${BUCKETS[k].label}<small>${w0(c.t[k])}</small></button>`).join('')}</div>`;
    if (desk) return chips + `<div class="accbody" style="padding:0;margin-top:16px">${planList(b, c)}<aside class="sbox ${b}">${sideBox(b, c)}</aside></div>`;
    const tabs = `<div class="seg" role="tablist">${PB.map(k => `<button class="${k === b ? 'on' : ''}" data-action="setBucket" data-b="${k}" role="tab" aria-selected="${k === b}"><i class="dot" style="background:var(--${k})"></i>${BUCKETS[k].label}</button>`).join('')}</div>`;
    return mobHead() + tabs + blockHTML(b, c);
  }

  /* ---------- goals ---------- */
  function viewGoals(){
    const g = S.goals, c = calc(M()), mg = G(), curName = (CURRENCIES.find(x => x[0] === CUR()) || [])[1] || '';
    const split = o => `<span class="sp-mini" aria-hidden="true"><i style="width:${o.needs}%;background:var(--needs)"></i><i style="width:${o.wants}%;background:var(--wants)"></i><i style="width:${o.savings}%;background:var(--savings)"></i></span>`;
    const thisMonth = `<button class="card sc" data-action="monthGoals" aria-label="Edit goals for ${monthName(S.current)}">
      <div class="sc-l"><div class="sc-lbl">${monthName(S.current)} goals</div><div class="sc-n">${mg.needs} / ${mg.wants} / ${mg.savings}</div><div class="sc-sub">${desk ? 'Needs, wants, savings. ' : ''}Applies to ${monthName(S.current)} only.</div></div>
      <div class="sc-r">${split(mg)}${IC.right}</div></button>`;
    const salary = `<button class="card sc" data-action="editIncome" aria-label="Default salary ${w0(S.profile.salary)} ${CUR()}. Change.">
      <div class="sc-l"><div class="sc-lbl">Default salary</div><div class="sc-n">${rollHTML('set-sal', w0(S.profile.salary || 0))}<small>${curSym()}</small></div><div class="sc-sub">${desk ? 'After tax. Prefilled when you start a month.' : 'After tax, for new months.'}</div></div>
      <div class="sc-r">${IC.right}</div></button>`;
    const currency = `<section class="card sc static">
      <div class="sc-l"><div class="sc-lbl">Currency</div><div class="sc-n">${CUR()}</div><div class="sc-sub">${esc(curName)}</div></div>
      <div class="sc-r"><select class="input sel" data-input="pcurrency" aria-label="Currency">${CURRENCIES.map(([k, n]) => `<option value="${k}" ${CUR() === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div></section>`;
    const defaults = `<section class="card sc static col">
      <div class="sc-top"><div class="sc-l"><div class="sc-lbl">Default split</div><div class="sc-n"><span data-bind="gN">${g.needs}</span> / <span data-bind="gW">${g.wants}</span> / <span data-bind="gS">${g.savings}</span></div><div class="sc-sub">${desk ? 'For months you start from now on. ' : 'For new months. '}${monthName(S.current)} keeps its own.</div></div>
        <div class="sc-r"><button class="link" data-action="goals503020">Use 50 / 30 / 20</button></div></div>
      <div class="sliders">
        <div class="srow"><span><i class="dot" style="background:var(--needs)"></i>Needs</span><small data-bind="gNk">${kr(c.inc * g.needs / 100)}</small></div>
        <input type="range" min="0" max="100" step="1" value="${g.needs}" data-input="gneeds" aria-label="Needs goal">
        <div class="srow"><span><i class="dot" style="background:var(--wants)"></i>Wants</span><small data-bind="gWk">${kr(c.inc * g.wants / 100)}</small></div>

        <div class="srow"><span><i class="dot" style="background:var(--savings)"></i>Savings</span><small data-bind="gSk">${kr(c.inc * g.savings / 100)}</small></div>

    const title = desk ? '' : `<h1 class="ptitle">Settings</h1>`;
    if (desk) return title + `<div class="ov ov2"><div class="ov-l">${thisMonth}${defaults}${salary}${currency}</div><div class="ov-r">${account}${help}${reset}</div></div>`;
    return title + thisMonth + defaults + salary + currency + account + help + reset;
  }


  /* ---------- faq ---------- */
  function viewWhy(){
    const L = (u, t) => `<a class="link" href="${u}" target="_blank" rel="noopener">${t}</a>`;
    const SRC = x => `<p class="src">${x}</p>`;
    const HOW = [
      ['What is this app for?', `<p>Paying the month on payday, in one sitting, and seeing where you stand before you spend. The aim is not to scrape by inside your means. It is to put your best foot forward: bills paid on time, savings growing, and the credit card never becoming the plan.</p><p>It runs on the 50/30/20 split: needs up to 50% of salary after tax, wants up to 30%, savings at least 20%. You can change the split any month.</p>` + SRC(`Origin of the split: Warren & Tyagi, <i>All Your Worth</i> (2005). Plain summary: ${L('https://www.acorns.com/money-basics/saving-and-budgeting/what-is-the-50-30-20-budget-rule-/','Acorns')}`)],
      ['Needs, wants or savings?', `<p><b>Need</b>: if your income stopped, you would still have to pay it. Rent, food, transport, insurance, the minimum on a loan.</p><p><b>Want</b>: it makes life nicer. Eating out, subscriptions, clothes, tech, travel.</p><p><b>Savings</b>: money you keep. Extra loan payments beyond the minimum count here too.</p><p>Not sure? Split it. The minimum version is a need, the upgrade is a want. Basic groceries, need. Fancy ones, want. The phone plan, need. A new phone while the old one works, want. Pick a place and stay consistent, that matters more than the exact call.</p>`],
      ['What is "Left to spend"?', `<p>Salary after tax, minus needs, wants and savings. It is also your room for error: spend it to zero and the next surprise lands on the card.</p><p>The Week toggle divides it by the weeks left in the month. There is no daily number on purpose, and from day three the month figure is rounded to the nearest hundred.</p>` + SRC(`Why a visible "available" figure needs care: Amasino et al. (2023), preregistered replication. Why weekly, not daily: De La Rosa & Tully (2021), <i>Journal of Consumer Research</i>`)],
      ['How do the rings work?', `<p>Three rings, one per goal.</p><ul><li><b>Savings fills</b> toward its goal and closes at 100%.</li><li><b>Needs and wants drain.</b> Full at payday, shrinking as you plan. The ring shows room left, not money spent. At the limit it is empty. Past it, a darker lap in the same colour shows how far over.</li></ul><p>Close the savings ring, keep the other two from lapping. All three on target is the month.</p>` + SRC(`Closing a goal motivates: ${L('https://business.columbia.edu/faculty/research/goal-gradient-hypothesis-resurrected-purchase-acceleration-illusionary-goal','Kivetz, Urminsky & Zheng (2006)')}. Showing "spent" as progress makes people spend the slack: ${L('https://dlab.sauder.ubc.ca/sjdm/presentations/2018-Poster-Huang-Liang-Budget-Feedback-Spending~.pdf','Huang & Liang (2018)')}, ${L('https://www.tiaa.org/public/institute/publication/2023/splurging-after-reaching-your-goal','Yin & Sharif (2023)')}`)],
      ['Why are goals set per month?', `<p>Because life is not the same every month. Settings holds the split for months you start from now on. A month you already have keeps its own, and you change it from its card in Settings.</p><p>Want to save more in December? Raise savings for December. November stays as it was, so the history stays honest.</p>` + SRC(`A new month is a fresh start people act on: ${L('https://faculty.wharton.upenn.edu/wp-content/uploads/2014/06/Dai_Fresh_Start_2014_Mgmt_Sci.pdf','Dai, Milkman & Riis (2014)')}`)],
      ['Starting a new month', `<p>Tap Start next to the month, or tap the month name and pick one. Your default salary from Settings fills in, change it for that month if payday was different. Everything copies by default. Untick one-off costs, or turn off amounts for bills that change.</p><p>Give a bill a payment date under Advanced and it shows in Coming up. Mark it fixed if the bank pulls it on that date.</p>`],
      ['Can I skip savings?', `<p>Yes. Set the amounts to 0, or tap "Skip savings this month" in Plan. The month shows as skipped, not failed.</p>`],
      ['Categories and groups', `<p>Every item has one category from a short fixed list, so each row says what kind of cost it is. Groups are your own headings inside a list, optional, used nowhere else.</p>`]
    ];
    const WHY = [
      ['What The Psychology of Money adds', `<p>Four ideas from Morgan Housel shape the app.</p><ul><li><b>Wealth is what you do not see.</b> "Kept, not spent" counts money that never became stuff.</li><li><b>Savings rate beats income.</b> Month by month tracks the rate, not the kronor.</li><li><b>Reasonable beats rational.</b> Goals are per month. A split you can live with beats a perfect one you abandon.</li><li><b>Room for error.</b> Left to spend is the buffer.</li></ul>` + SRC(L('https://www.harriman-house.com/psychologyofmoney','Housel, The Psychology of Money (2020)'))],
      ['Why no streaks, badges or alerts?', `<p>A streak motivates until it breaks, then it does the opposite. So the history shows months on target and the savings trend, nothing that can snap. And nothing pings you. You come here on payday.</p>` + SRC(`${L('https://www.colorado.edu/business/faculty-research/2023/04/19/or-track-how-broken-streaks-affect-consumer-decisions','Silverman & Barasch (2023)')} on broken streaks. ${L('https://fortune.com/well/2025/01/24/apple-watch-bullied-burn-calories-close-rings-obsession-fitness-trackers-notifications','Fortune (2025)')} on ring anxiety, reporting not a study.`)],
      ['Why is the credit card shown without a total?', `<p>It appears as dated rows in Coming up, with what it was for. No red block, no debt total. People look away from numbers that feel bad, and looking away is how the card becomes the plan. A date and a name are easier to face than a sum.</p>` + SRC(`${L('https://www.nber.org/papers/w23945','Olafsson & Pagel (2017), The Ostrich in Us')}`)]
    ];
    const acc = list => list.map(([q, a]) => `<details class="card faqi"><summary>${q}</summary><div class="fa">${a}</div></details>`).join('');
    return `<button class="link backlink" data-action="go" data-page="goals" aria-label="Back to Settings">${IC.left}<span>Settings</span></button>
    <h1 class="ptitle">FAQ</h1><p class="lead">The parts that take a moment to get, and the thinking behind them.</p>
    <div class="sec">How it works</div><div class="faq">${acc(HOW)}</div>
    <div class="sec">The thinking behind it</div><div class="faq">${acc(WHY)}</div>
    <p class="lead" style="font-size:13px;margin-top:20px">Studies are about people in general, not tests of this app. This is a rule of thumb, not financial advice.</p>`;
  }

  /* ---------- new month flow ---------- */
  function startFlow(key){

  }
  function flowItems(){
    const f = ui.flow, sm = S.months[f.src];

  }
  function flowMonth(){
    const f = ui.flow;

  function flowRender(){

      ${list}

  /* ---------- actions ---------- */

  function insertItem(m, it){

  }
  const A = {
    go(a){ if (ui.sheetRender) closeSheet(); go(a.dataset.page); },
    monthPrev(){ const k = sortedKeys(), i = k.indexOf(S.current); if (i > 0){ S.current = k[i - 1]; ui.anim = true; syncAll(); } },
    monthNext(){ const k = sortedKeys(), i = k.indexOf(S.current); if (i < k.length - 1){ S.current = k[i + 1]; ui.anim = true; syncAll(); } },
    newMonth(){ startFlow(); },
    signOut(){ toast('Sign out is not part of the prototype'); },
    editIncome(){ incomeSheet(); },
    monthGoals(){ monthGoalsSheet(); },
    toggleLock(a){ const sw = a.querySelector('.sw'); const on = !sw.classList.contains('on'); sw.classList.toggle('on', on); a.setAttribute('aria-checked', on); },
    toggleAdv(a){
      const box = R('advBox'), open = box.hasAttribute('hidden');
      if (open) box.removeAttribute('hidden'); else box.setAttribute('hidden', '');
      a.setAttribute('aria-expanded', open);
      if (open) setTimeout(() => { const f = R('fDue'); if (f) f.focus(); }, 60);
    },
    draft503020(){ ui.draft = {needs:50, wants:30, savings:20}; rerenderSheet(); },
    saveMonthGoals(){ M().goals = Object.assign({}, ui.draft); closeSheet(); toast(monthName(S.current) + ' goals saved'); },
    monthsAll(){ ui.monthsAll = !ui.monthsAll; render(); },
    monthPicker(){ ui.pickYear = +S.current.slice(0, 4); pickerSheet(); },
    pickYear(a){ ui.pickYear += +a.dataset.d; rerenderSheet(); },
    pickMonth(a){
      const key = a.dataset.key;
      if (S.months[key]){ S.current = key; ui.anim = true; closeSheet(); }
      else { closeSheet(); startFlow(key); }
    },
    saveIncome(){ const v = parseAmt(R('fInc').value) || 0; M().income = v; const d = R('defSw'); if (d && d.classList.contains('on')) S.profile.salary = v; closeSheet(); toast(d && d.classList.contains('on') ? 'Salary saved as default' : 'Salary saved'); },
    toggleDef(a){ const sw = a.querySelector('.sw'); const on = !sw.classList.contains('on'); sw.classList.toggle('on', on); a.setAttribute('aria-checked', on); },
    skipSavings(){
      const m = M(), snap = JSON.stringify(m.items);
      m.items.forEach(i => { if (i.bucket === 'savings') i.amount = 0; });
      syncAll(); toast('Savings set to 0 this month', () => { m.items = JSON.parse(snap); syncAll(); });
    },
    closeSheet(){ closeSheet(); },
    goBucket(a){ const b = a.dataset.b; ui.bucket = ui.accOpen = b; go('plan'); },
    heroMode(a){ ui.heroMode = a.dataset.m; render(); },
    openBucket(a){ ui.bucket = a.dataset.b; ui.accOpen = a.dataset.b; go('plan'); },
    accToggle(a){ ui.accOpen = ui.accOpen === a.dataset.b ? null : a.dataset.b; render(); nav(); const h = q('.acch[aria-expanded=true]'); if (h) h.scrollIntoView({block:'start', behavior:'smooth'}); },
    setBucket(a){ ui.bucket = a.dataset.b; ui.accOpen = a.dataset.b; render(); nav(); },
    focusSalary(){ const el = q('input[data-input=income]'); if (el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.focus(); } },
    jumpMissing(){
      const it = M().items.find(i => i.amount == null); if (!it) return;
      ui.bucket = it.bucket; ui.accOpen = it.bucket; ui.page = 'plan'; render(); nav();
      setTimeout(() => { const el = q(`input[data-id="${it.id}"]`); if (el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.focus(); } }, 120);
    },
    togglePaid(a){ const it = M().items.find(i => i.id === a.dataset.id); it.paid = !it.paid; syncAll(); },
    editItem(a){ itemSheet(a.dataset.id); },
    addItem(a){ itemSheet(null, a.dataset.b); },
    saveItem(a){
      const nameEl = R('fName'), name = nameEl.value.trim(); if (!name){ nameEl.focus(); return; }
      const amt = parseAmt(R('fAmt').value), cat = R('fCat').value, group = R('fGroup').value.trim(), m = M();
      const dn = parseInt((R('fDue').value || '').split('-')[2], 10), due = dn >= 1 && dn <= 31 ? dn : null;
      const locked = R('lockSw').classList.contains('on');
      if (a.dataset.id){ const it = m.items.find(i => i.id === a.dataset.id); Object.assign(it, {name, amount:amt, cat, group, due, locked}); }
      else { const nid = uid(); insertItem(m, {id:nid, bucket:a.dataset.b, cat, group, name, amount:amt, due, locked, paid:false}); ui.flash = nid; setTimeout(() => { ui.flash = null; }, 2000); }
      closeSheet(); toast(a.dataset.id ? 'Saved' : name + ' added');
    },
    deleteItem(a){
      const m = M(), snap = JSON.stringify(m.items), nm = (m.items.find(i => i.id === a.dataset.id) || {}).name || 'Item';
      m.items = m.items.filter(i => i.id !== a.dataset.id);
      closeSheet(); toast(nm + ' removed', () => { m.items = JSON.parse(snap); syncAll(); });
    },
    chipAdd(a){
      const it = S.months[a.dataset.src].items.find(i => i.id === a.dataset.id);
      const nid = uid(); insertItem(M(), Object.assign({}, it, {id:nid, paid:false})); ui.flash = nid; setTimeout(() => { ui.flash = null; }, 2000); syncAll(); toast(it.name + ' added');
    },
    goals503020(){ S.goals = {needs:50, wants:30, savings:20}; syncAll(); },
    undo(){ if (ui.undo){ ui.undo(); ui.undo = null; R('toast').classList.remove('show'); } },
    resetDemo(){ resetAll(); },
    flowNext(){ const f = ui.flow; if (f.step < 3){ f.step++; rerenderSheet(); R('sheetIn').scrollTop = 0; } },
    flowBack(){ const f = ui.flow; if (f.step > 1){ f.step--; rerenderSheet(); R('sheetIn').scrollTop = 0; } },
    flowMode(a){ ui.flow.mode = a.dataset.m; rerenderSheet(); },
    flowToggle(a){ const p = ui.flow.picked; p.has(a.dataset.id) ? p.delete(a.dataset.id) : p.add(a.dataset.id); rerenderSheet(); },
    flowKeep(){ ui.flow.keep = !ui.flow.keep; rerenderSheet(); },
    flowCreate(){
      const f = ui.flow, tm = flowMonth();
      S.months[f.key] = {income:f.income, goals:Object.assign({}, S.goals), items:tm.items.map(i => Object.assign({}, i, {id:uid(), paid:false}))};
      S.current = f.key; ui.page = 'overview'; ui.anim = true;
      closeSheet(); toast(monthName(f.key) + ' is ready, rings reset');
    }
  };
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-action]'); if (!a) return;
    const fn = A[a.dataset.action]; if (fn) fn(a, e);
  });

  /* ---------- typing: keep focus while both views update ---------- */
  function typed(t, kind, id){
    const raw = t.value; save();
    apps.forEach(a => { if (a !== self) a.render(); });
    ui.restoring = true; render();
    const el = q(`[data-input="${kind}"]${id ? `[data-id="${id}"]` : ''}`);
    if (el){ el.focus({preventScroll:true}); el.value = raw; try{ el.setSelectionRange(raw.length, raw.length); }catch(e){} }
    ui.restoring = false;
  }
  root.addEventListener('input', e => {
    const t = e.target, k = t.dataset.input; if (!k) return;
    if (k === 'amount'){ M().items.find(i => i.id === t.dataset.id).amount = parseAmt(t.value); typed(t, 'amount', t.dataset.id); }
    else if (k === 'income'){ M().income = parseAmt(t.value) || 0; typed(t, 'income', ''); }
    else if (k === 'gneeds' || k === 'gwants'){
      const g = S.goals, v = +t.value;
      if (k === 'gneeds'){ g.needs = v; if (g.needs + g.wants > 100) g.wants = 100 - g.needs; } else { g.wants = v; if (g.needs + g.wants > 100) g.needs = 100 - g.wants; }
      g.savings = 100 - g.needs - g.wants;
      const inc = calc(M()).inc, set = (n, v) => { const el = q('[data-bind=' + n + ']'); if (el) el.textContent = v; };
      set('gN', g.needs + '%'); set('gW', g.wants + '%'); set('gS', g.savings + '%');
      set('gNk', kr(inc * g.needs / 100)); set('gWk', kr(inc * g.wants / 100)); set('gSk', kr(inc * g.savings / 100));
      const sl = qa('input[type=range]'); if (sl[0]) sl[0].value = g.needs; if (sl[1]) sl[1].value = g.wants;
      save(); apps.forEach(a => { if (a !== self) a.render(); });
    }
    else if (k === 'dneeds' || k === 'dwants'){
      const d = ui.draft, v = +t.value;
      if (k === 'dneeds'){ d.needs = v; if (d.needs + d.wants > 100) d.wants = 100 - d.needs; } else { d.wants = v; if (d.needs + d.wants > 100) d.needs = 100 - d.wants; }
      d.savings = 100 - d.needs - d.wants;
      const inc = calc(M()).inc, box = R('sheetIn'), set = (n, val) => { const el = box.querySelector('[data-bind=' + n + ']'); if (el) el.textContent = val; };
      set('dN', d.needs + '%'); set('dW', d.wants + '%'); set('dS', d.savings + '%');
      set('dNk', kr(inc * d.needs / 100)); set('dWk', kr(inc * d.wants / 100)); set('dSk', kr(inc * d.savings / 100));
      const sl = box.querySelectorAll('input[type=range]'); if (sl[0]) sl[0].value = d.needs; if (sl[1]) sl[1].value = d.wants;
    }
    else if (k === 'cat'){ const h = R('catHelp'); if (h) h.textContent = CAT_HELP[t.value] || ''; }
    else if (k === 'flowinc') ui.flow.income = parseAmt(t.value) || 0;
    else if (k === 'pname'){ S.profile.name = t.value.trim() || 'You'; save(); apps.forEach(a => a.refreshWho && a.refreshWho()); }
    else if (k === 'psalary'){ S.profile.salary = parseAmt(t.value) || 0; save(); }
    else if (k === 'pcurrency'){ S.profile.currency = t.value; syncAll(); }
  });
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.input === 'cat'){ const h = R('catHelp'); if (h) h.textContent = CAT_HELP[t.value] || ''; return; }
    if (t.dataset.input === 'flowsrc'){ const f = ui.flow, sm = S.months[t.value]; f.src = t.value; f.income = sm.income; f.picked = new Set(sm.items.map(i => i.id)); rerenderSheet(); }
  });
  const isAmt = t => t.dataset && (t.dataset.input === 'amount' || t.dataset.input === 'income');
  const rawOf = t => t.dataset.input === 'income' ? M().income : (M().items.find(i => i.id === t.dataset.id) || {}).amount;
  root.addEventListener('focusin', e => {
    const t = e.target; if (ui.restoring || !isAmt(t)) return;
    const v = rawOf(t); t.value = v == null ? '' : String(v); setTimeout(() => t.select(), 0);
  });
  root.addEventListener('focusout', e => {
    const t = e.target; if (ui.restoring || !isAmt(t)) return;
    const v = rawOf(t); t.value = v == null ? '' : fmtN(v);
  });
  root.addEventListener('keydown', e => {
    if (e.key === 'Enter' && isAmt(e.target)){ e.preventDefault(); e.target.blur(); }
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('[data-r=sheetIn]')){ const pb = q('[data-r=sheetIn] .btn-primary'); if (pb){ e.preventDefault(); pb.click(); } }
  });

  const hideSheet = () => { q('.backdrop').classList.remove('open'); q('.sheet').classList.remove('open'); ui.sheetRender = null; ui.flow = null; };
  self.route = r => {
    if (r === 'overview') ui.page = 'overview';
    else if (r === 'preferences') ui.page = 'goals';
    else if (r === 'faq') ui.page = 'why';
    else if (r === 'plan'){ ui.page = 'plan'; ui.accOpen = null; }
    else if (/^plan-(needs|wants|savings)$/.test(r)){ ui.page = 'plan'; ui.accOpen = ui.bucket = r.slice(5); }
    else return;
    hideSheet(); ui.anim = true; render(); R('screen').scrollTop = 0;
  };
  self.reset = () => { ui.page = 'overview'; ui.bucket = 'needs'; ui.flow = null; ui.sheetRender = null; ui.anim = true; q('.backdrop').classList.remove('open'); q('.sheet').classList.remove('open'); };
  self.toast = toast;
  apps.push(self);
  return self;
}

/* =========================================================
   Boot
   ========================================================= */
function resetAll(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = seed(); apps.forEach(a => a.reset()); syncAll(); apps[0].toast('Demo reset');
}
createApp(document.getElementById('deskRoot'), 'desk');
createApp(document.getElementById('mobRoot'), 'mob');
syncAll();
applyRoute();
addEventListener('hashchange', applyRoute);
document.getElementById('resetAll').addEventListener('click', resetAll);
document.addEventListener('keydown', e => { if (e.key === 'Escape') apps.forEach(a => a.closeSheet()); });

/* fit both frames side by side to the window width */
function fit(){
  const box = document.getElementById('fitbox'), inner = document.getElementById('fit');
  if (innerWidth < 820){ box.style.width = box.style.height = ''; inner.style.transform = ''; return; }
  const W = 1672, H = 760, s = Math.min(1, (innerWidth - 32) / W);
  inner.style.transform = `scale(${s})`; box.style.width = W * s + 'px'; box.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();
</script>
